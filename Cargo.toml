[package]
name = "wat"
version = "0.1.2"
edition = "2024"

[dependencies]
notify-debouncer-full = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
globset = "0.4"
lexopt = "0.3"

[profile.release]
opt-level = 3
#debug = true
lto = true
strip = true
codegen-units = 1
panic = "abort"
